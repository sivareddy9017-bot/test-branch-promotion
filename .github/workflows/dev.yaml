
name: Branch Promotion for Test Workflow

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - dev
      - int62

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    name: Create and Auto-Merge Promotion PR
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine promotion
        id: promotion
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TARGET: ${{ github.event.pull_request.base.ref }}
        run: |
          case "$EVENT_NAME:$PR_TARGET" in
            workflow_dispatch:*)
              SOURCE="main"
              TARGET="dev"
              ;;
            pull_request:main)
              SOURCE="main"
              TARGET="dev"
              ;;
            pull_request:dev)
              SOURCE="dev"
              TARGET="int62"
              ;;
            pull_request:int62)
              SOURCE="int62"
              TARGET="prod"
              ;;
            *)
              echo "No promotion mapping found."
              exit 1
              ;;
          esac

          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

          echo "Promotion: $SOURCE -> $TARGET"

      - name: Create and auto-merge promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ steps.promotion.outputs.source }}
          TARGET: ${{ steps.promotion.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Promotion: $SOURCE -> $TARGET"

          git fetch origin

          # Verify source and target branches exist
          git ls-remote --exit-code --heads origin "$SOURCE" >/dev/null
          git ls-remote --exit-code --heads origin "$TARGET" >/dev/null

          # Verify common ancestor
          git merge-base \
            "origin/$TARGET" "origin/$SOURCE" >/dev/null

          # Check for commits to promote
          COUNT=$(git rev-list --count \
            "origin/$TARGET..origin/$SOURCE")

          echo "Commits to promote: $COUNT"

          if [[ "$COUNT" -eq 0 ]]; then
            echo "No new commits to promote."
            exit 0
          fi

          # Find an existing promotion PR, if present
          PR_URL=$(gh pr list \
            --repo "$GH_REPO" \
            --base "$TARGET" \
            --head "$SOURCE" \
            --state open \
            --json url \
            --jq '.[0].url // empty')

          # Create a PR only if one does not already exist
          if [[ -z "$PR_URL" ]]; then
            PR_URL=$(gh pr create \
              --repo "$GH_REPO" \
              --base "$TARGET" \
              --head "$SOURCE" \
              --title "Promote $SOURCE to $TARGET" \
              --body "Automated promotion PR from $SOURCE to $TARGET.")

            echo "Created promotion PR: $PR_URL"
          else
            echo "Using existing promotion PR: $PR_URL"
          fi

          # Enable automatic merging
          gh pr merge "$PR_URL" \
            --repo "$GH_REPO" \
            --merge \
            --auto

          echo "Auto-merge enabled for: $PR_URL"
