
name: Automatic Branch Promotions and Nginx Installation

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automatic-branch-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote main to dev to int62
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Step 2: Verify GitHub authentication
      - name: Verify GitHub CLI authentication
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          : "${GH_TOKEN:?PROMOTION_TOKEN secret is missing}"

          gh auth status
          gh repo view "$GH_REPO" --json name

      # Step 3: Promote main -> dev -> int62
      - name: Promote branches
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          promote() {
            local SOURCE="$1"
            local TARGET="$2"
            local COUNT
            local PR_URL

            echo "======================================"
            echo "Promotion: $SOURCE -> $TARGET"
            echo "======================================"

            git fetch origin \
              "+refs/heads/$SOURCE:refs/remotes/origin/$SOURCE" \
              "+refs/heads/$TARGET:refs/remotes/origin/$TARGET"

            git merge-base \
              "origin/$TARGET" "origin/$SOURCE" >/dev/null

            COUNT=$(git rev-list --count \
              "origin/$TARGET..origin/$SOURCE")

            echo "Commits to promote: $COUNT"

            if [[ "$COUNT" -eq 0 ]]; then
              echo "No changes to promote."
              return 0
            fi

            PR_URL=$(gh pr list \
              --repo "$GH_REPO" \
              --base "$TARGET" \
              --head "$SOURCE" \
              --state open \
              --json url \
              --jq '.[0].url // empty')

            if [[ -z "$PR_URL" ]]; then
              PR_URL=$(gh pr create \
                --repo "$GH_REPO" \
                --base "$TARGET" \
                --head "$SOURCE" \
                --title "Promote $SOURCE to $TARGET" \
                --body "Automated promotion PR from $SOURCE to $TARGET.")

              echo "Created PR: $PR_URL"
            else
              echo "Using existing PR: $PR_URL"
            fi

            gh pr merge "$PR_URL" \
              --repo "$GH_REPO" \
              --merge

            echo "Successfully promoted $SOURCE -> $TARGET"

            git fetch origin \
              "+refs/heads/$SOURCE:refs/remotes/origin/$SOURCE" \
              "+refs/heads/$TARGET:refs/remotes/origin/$TARGET"
          }

          promote main dev
          promote dev int62

          echo "All branch promotions completed."

      # Step 4: Install and start Nginx on EC2
      - name: Install and start Nginx
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          : "${SERVER_HOST:?SERVER_HOST secret is missing}"
          : "${SERVER_USER:?SERVER_USER secret is missing}"
          : "${SSH_PRIVATE_KEY:?SERVER_SSH_KEY secret is missing}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"

          echo "Checking SSH connectivity to EC2..."

          if ! ssh-keyscan -T 10 -H "$SERVER_HOST

