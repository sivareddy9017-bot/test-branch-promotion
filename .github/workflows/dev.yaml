
name: Automatic Branch Promotions and Nginx Installation

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automatic-branch-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote branches and configure Nginx
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # --------------------------------------------------
      # 2. Verify GitHub CLI authentication
      # --------------------------------------------------
      - name: Verify GitHub CLI authentication
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          : "${GH_TOKEN:?PROMOTION_TOKEN secret is missing}"

          gh auth status
          gh repo view "$GH_REPO" --json name

      # --------------------------------------------------
      # 3. Promote main -> dev -> int62
      # --------------------------------------------------
      - name: Promote branches
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          promote() {
            local SOURCE="$1"
            local TARGET="$2"
            local COUNT
            local PR_URL

            echo "======================================"
            echo "Promotion: $SOURCE -> $TARGET"
            echo "======================================"

            git fetch origin \
              "+refs/heads/$SOURCE:refs/remotes/origin/$SOURCE" \
              "+refs/heads/$TARGET:refs/remotes/origin/$TARGET"

            git merge-base \
              "origin/$TARGET" "origin/$SOURCE" >/dev/null

            COUNT=$(git rev-list --count \
              "origin/$TARGET..origin/$SOURCE")

            echo "Commits to promote: $COUNT"

            if [[ "$COUNT" -eq 0 ]]; then
              echo "No changes to promote."
              return 0
            fi

            PR_URL=$(gh pr list \
              --repo "$GH_REPO" \
              --base "$TARGET" \
              --head "$SOURCE" \
              --state open \
              --json url \
              --jq '.[0].url // empty')

            if [[ -z "$PR_URL" ]]; then
              PR_URL=$(gh pr create \
                --repo "$GH_REPO" \
                --base "$TARGET" \
                --head "$SOURCE" \
                --title "Promote $SOURCE to $TARGET" \
                --body "Automated promotion PR from $SOURCE to $TARGET.")

              echo "Created PR: $PR_URL"
            else
              echo "Using existing PR: $PR_URL"
            fi

            gh pr merge "$PR_URL" \
              --repo "$GH_REPO" \
              --merge

            echo "Successfully promoted $SOURCE -> $TARGET"
          }

          promote main dev
          promote dev int62

          echo "All branch promotions completed."

      # --------------------------------------------------
      # 4. Validate SSH secrets and private key
      # --------------------------------------------------
      - name: Validate SSH configuration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          : "${SERVER_HOST:?SERVER_HOST secret is missing}"
          : "${SERVER_USER:?SERVER_USER secret is missing}"
          : "${SSH_PRIVATE_KEY:?SERVER_SSH_KEY secret is missing}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" |
            tr -d '\r' > "$HOME/.ssh/ec2_key"

          chmod 600 "$HOME/.ssh/ec2_key"

          echo "Checking private key format..."

          if ! ssh-keygen -y \
              -f "$HOME/.ssh/ec2_key" \
              > "$HOME/.ssh/derived.pub"; then
            echo "ERROR: Private key is invalid or requires a passphrase."
            exit 1
          fi

          echo "Private key is valid."
          echo "Derived public-key fingerprint:"

          ssh-keygen -lf "$HOME/.ssh/derived.pub"

          echo "SSH username: $SERVER_USER"
          echo "SSH configuration validation completed."

      # --------------------------------------------------
      # 5. Check SSH connectivity and retrieve host key
      # --------------------------------------------------
      - name: Check EC2 SSH connectivity
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking SSH connectivity to EC2..."

          if ! timeout 10 bash -c \
              'exec 3<>/dev/tcp/$1/22' _ "$SERVER_HOST" \
              2>/dev/null; then
            echo "ERROR: Cannot reach SSH port 22."
            echo "Check the host address, instance status, and security group."
            exit 1
          fi

          echo "SSH port 22 is reachable."

          if ! ssh-keyscan -T 10 -p 22 \
              -t ed25519,rsa "$SERVER_HOST" \
              > "$HOME/.ssh/known_hosts" \
              2> "$HOME/.ssh/keyscan.log"; then
            cat "$HOME/.ssh/keyscan.log"
            echo "ERROR: Failed to retrieve SSH host key."
            exit 1
          fi

          if [[ ! -s "$HOME/.ssh/known_hosts" ]]; then
            echo "ERROR: No SSH host key was retrieved."
            exit 1
          fi

          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH host key retrieved."

      # --------------------------------------------------
      # 6. Diagnose and test SSH authentication
      # --------------------------------------------------
      - name: Diagnose EC2 SSH authentication
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing SSH authentication as $SERVER_USER..."

          set +e
          ssh -vvv \
            -i "$HOME/.ssh/ec2_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "whoami" \
            > "$HOME/.ssh/ssh-debug.log" 2>&1
          SSH_STATUS=$?
          set -e

          grep -E \
            'Offering public key|Server accepts key|Authentications that can continue|Load key|identity file|sign_and_send_pubkey|Authenticated to|Permission denied|No more authentication methods' \
            "$HOME/.ssh/ssh-debug.log" || true

          if [[ "$SSH_STATUS" -ne 0 ]]; then
            echo "ERROR: SSH authentication failed."
            echo "Exit code: $SSH_STATUS"
            exit "$SSH_STATUS"
          fi

          echo "SSH authentication successful."

      # --------------------------------------------------
      # 7. Install and start Nginx
      # --------------------------------------------------
      - name: Install and start Nginx
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing Nginx on EC2..."

          ssh \
            -i "$HOME/.ssh/ec2_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "sudo apt-get update &&
             sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx &&
             sudo nginx -t &&
             sudo systemctl enable --now nginx &&
             sudo systemctl is-active nginx"

          echo "SUCCESS: Nginx is installed and running."

      # --------------------------------------------------
      # 8. Workflow summary
      # --------------------------------------------------
      - name: Workflow summary
        if: success()
        shell: bash
        run: |
          echo "Branch promotions completed."
          echo "SSH authentication succeeded."
          echo "Nginx installation and verification completed."




