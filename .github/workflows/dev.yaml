

name: Automatic Branch Promotion

on:
  pull_request:
    types: [closed]
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automatic-branch-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote main to dev to int62
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
        run: |
          gh auth status

      - name: Promote main to dev and dev to int62
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          promote() {
            local SOURCE="$1"
            local TARGET="$2"
            local COUNT
            local PR_URL

            echo "======================================"
            echo "Promotion: $SOURCE -> $TARGET"
            echo "======================================"

            # Update remote branch information
            git fetch origin \
              "+refs/heads/$SOURCE:refs/remotes/origin/$SOURCE" \
              "+refs/heads/$TARGET:refs/remotes/origin/$TARGET"

            # Verify that branches have a common ancestor
            git merge-base \
              "origin/$TARGET" "origin/$SOURCE" >/dev/null

            # Check whether commits need promoting
            COUNT=$(git rev-list --count \
              "origin/$TARGET..origin/$SOURCE")

            echo "Commits to promote: $COUNT"

            if [[ "$COUNT" -eq 0 ]]; then
              echo "No changes to promote from $SOURCE to $TARGET."
              return 0
            fi

            # Find an existing open promotion PR
            PR_URL=$(gh pr list \
              --repo "$GH_REPO" \
              --base "$TARGET" \
              --head "$SOURCE" \
              --state open \
              --json url \
              --jq '.[0].url // empty')

            # Create a PR if one does not exist
            if [[ -z "$PR_URL" ]]; then
              PR_URL=$(gh pr create \
                --repo "$GH_REPO" \
                --base "$TARGET" \
                --head "$SOURCE" \
                --title "Promote $SOURCE to $TARGET" \
                --body "Automated promotion: $SOURCE to $TARGET.")

              echo "Created promotion PR: $PR_URL"
            else
              echo "Existing promotion PR: $PR_URL"
            fi

            # Merge immediately; do not use GitHub auto-merge
            gh pr merge "$PR_URL" \
              --repo "$GH_REPO" \
              --merge

            echo "Successfully merged: $SOURCE -> $TARGET"

            # Refresh branch information after the merge
            git fetch origin \
              "+refs/heads/$SOURCE:refs/remotes/origin/$SOURCE" \
              "+refs/heads/$TARGET:refs/remotes/origin/$TARGET"
          }

          # Stage 1: main -> dev
          promote main dev

          # Stage 2: dev -> int62
          # Runs only if Stage 1 succeeds or has nothing to promote.
          promote dev int62

          echo "All promotion stages completed."
