


name: Automatic Branch Promotionss

on:
  pull_request:
    types: [closed]
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automatic-branch-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote main to dev to int62
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify GitHub CLI authentication
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "ERROR: PROMOTION_TOKEN is missing or unavailable."
            exit 1
          fi

          gh auth status
          gh repo view "$GH_REPO" --json name

      - name: Promote main to dev and dev to int62
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          promote() {
            local SOURCE="$1"
            local TARGET="$2"
            local COUNT
            local PR_URL

            echo "======================================"
            echo "Promotion: $SOURCE -> $TARGET"
            echo "======================================"

            # Fetch the latest source and target branches.
            git fetch origin \
              "+refs/heads/$SOURCE:refs/remotes/origin/$SOURCE" \
              "+refs/heads/$TARGET:refs/remotes/origin/$TARGET"

            # Ensure the branches have a common ancestor.
            git merge-base \
              "origin/$TARGET" "origin/$SOURCE" >/dev/null

            # Count commits present in source but not target.
            COUNT=$(git rev-list --count \
              "origin/$TARGET..origin/$SOURCE")

            echo "Commits to promote: $COUNT"

            if [[ "$COUNT" -eq 0 ]]; then
              echo "No changes to promote. Skipping."
              return 0
            fi

            # Find an existing open promotion PR.
            PR_URL=$(gh pr list \
              --repo "$GH_REPO" \
              --base "$TARGET" \
              --head "$SOURCE" \
              --state open \
              --json url \
              --jq '.[0].url // empty')

            # Create the PR if one does not exist.
            if [[ -z "$PR_URL" ]]; then
              PR_URL=$(gh pr create \
                --repo "$GH_REPO" \
                --base "$TARGET" \
                --head "$SOURCE" \
                --title "Promote $SOURCE to $TARGET" \
                --body "Automated promotion PR from $SOURCE to $TARGET.")

              echo "Created promotion PR: $PR_URL"
            else
              echo "Using existing promotion PR: $PR_URL"
            fi

            # Merge immediately; repository rules still apply.
            gh pr merge "$PR_URL" \
              --repo "$GH_REPO" \
              --merge

            echo "Successfully merged $SOURCE -> $TARGET"

            # Refresh branches after the merge.
            git fetch origin \
              "+refs/heads/$SOURCE:refs/remotes/origin/$SOURCE" \
              "+refs/heads/$TARGET:refs/remotes/origin/$TARGET"
          }

          # Stage 1: main -> dev
          promote main dev

          # Stage 2: dev -> int62
          # Runs only if Stage 1 succeeds or has nothing to promote.
          promote dev int62

          echo "All promotion stages completed."
